<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>CMet - Live Map</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css">
    </head>
    <body>
        <div id="loginDiv">
            <label for="vehicleId">Nº de frota:</label><input id="vehicleId" inputmode="numeric" pattern="[0-9]" autocomplete="off" maxlength="4" placeholder="1400">
            <p id="status"><span></span></p>
            <button id="loginBtn">Ver Mapa</button>
        </div>
        <div id="main">
            <div id="map"></div>
        </div>
        <button id="login">Terminar serviço</button>
        <script type="module" src="./map.js"></script>
        <script src="./index.js"></script>
    </body>
</html>
